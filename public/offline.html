<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ebebeb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <title>Offline · Realtime Chat</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f5;
        --fg: #242424;
        --muted: #616161;
        --accent: #5b5fc7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f1f1f;
          --fg: #f5f5f5;
          --muted: #adadad;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      h1 {
        margin: 16px 0 4px;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 0.95rem;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 12px 20px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Chat will come back as soon as you're connected.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
